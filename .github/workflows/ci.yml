name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-26   # the free engine uses macOS 26 Speech APIs (DictationTranscriber); Xcode 16 lacks them
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Swift version
        id: swift
        run: |
          swift --version
          echo "version=$(swift --version 2>&1 | grep -o 'Swift version [0-9.]*' | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache .build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: build-${{ runner.os }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.swift') }}   # zero packages: no Package.resolved
          restore-keys: |
            build-${{ runner.os }}-${{ steps.swift.outputs.version }}-

      # Pinned release binaries, checked against the SHA-256 GitHub publishes for each asset (owner D15, 2026-10-25).
      # To upgrade: change the version and the hash together, and match the local Homebrew versions.
      - name: Install pinned tools (swiftformat 0.63.1, swiftlint 0.65.1, gitleaks 8.30.1)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/tools"; mkdir -p "$d"; cd "$d"
          curl -fsSL -o swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.1/swiftformat.zip
          curl -fsSL -o swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz
          shasum -a 256 -c <<'EOF'
          385ef1a263ba28685157b98c5536b9c9105e124518f28b7ef8a2bee4b167eaeb  swiftformat.zip
          c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  swiftlint.zip
          b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5  gitleaks.tar.gz
          EOF
          unzip -oq swiftformat.zip swiftformat; unzip -oq swiftlint.zip swiftlint; tar xzf gitleaks.tar.gz gitleaks
          chmod +x swiftformat swiftlint gitleaks
          echo "$d" >> "$GITHUB_PATH"

      - name: Secrets scan (gitleaks, tracked tree)
        run: |   # the committed tree only (not the restored .build cache), as scripts/prelaunch_check.sh does
          t="$RUNNER_TEMP/tree"; mkdir -p "$t"; git archive HEAD | tar -x -C "$t"
          gitleaks dir --no-banner --redact --config .gitleaks.toml "$t"

      - name: Hook tests
        run: .claude/hooks/test_hooks.sh

      - name: Format check
        run: swiftformat --lint .

      - name: Lint (against baseline)
        run: scripts/lint.sh

      - name: Build (release)
        run: swift build -c release

      - name: Tests
        run: scripts/test.sh

      - name: Report-script tests
        run: python3 -I Tests/test_report.py

      - name: Bundle app (ad-hoc signed)
        run: NO_INSTALL=1 scripts/bundle.sh

      - name: Zip app
        run: ditto -c -k --keepParent build/Soyla.app build/Soyla.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Soyla-app
          path: build/Soyla.zip
          retention-days: 14
