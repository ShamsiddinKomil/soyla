blank_issues_enabled: false
contact_links:
  - name: Something isn't working? Start here
    url: https://github.com/ShamsiddinKomil/soyla/blob/main/docs/TROUBLESHOOTING.md
    about: Nothing pastes, the hotkey does nothing, "No audio", a rejected key. Most fixes are one toggle.
  - name: Questions (FAQ)
    url: https://github.com/ShamsiddinKomil/soyla/blob/main/docs/FAQ.md
    about: How do I…, which model, what does it cost. Not answered there? Open a feature request with your question.
  - name: Official download (the only one)
    url: https://github.com/ShamsiddinKomil/soyla/releases
    about: Never post your API key; Soyla never asks for it. Download only from Releases and check the SHA-256 file and certificate fingerprint.
  - name: Report a security problem privately
    url: https://github.com/ShamsiddinKomil/soyla/security/advisories/new
    about: Please don't open a public issue for anything that could expose keys, audio or text.
