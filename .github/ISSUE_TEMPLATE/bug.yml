name: Bug report
description: Something does not work (text not pasted, hotkey ignored, wrong text, crash)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Paste problems are the most common issue in dictation apps, so the fields below matter.
        Please avoid pasting private dictated text.

        **Never post your API key**, here or anywhere. Soyla and its maintainer will never ask for it; anyone who does is not us.
        The only official download is this repository's [Releases](https://github.com/ShamsiddinKomil/soyla/releases) page; check the zip with its `.sha256` file and the signing-certificate fingerprint in the release notes ([how](https://github.com/ShamsiddinKomil/soyla/blob/main/docs/INSTALL.md#1-download-and-install)).
  - type: input
    id: version
    attributes:
      label: Soyla version
      description: Settings → About. **Report a Problem…** in the menu bar icon fills in this, macOS, hotkey, keyboard layout and microphone for you.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.2"
    validations:
      required: true
  - type: input
    id: hotkey
    attributes:
      label: Hotkey in use
      placeholder: "fn (hold)"
    validations:
      required: true
  - type: input
    id: layout
    attributes:
      label: Keyboard layout
      description: Dvorak and non-US layouts affect paste.
      placeholder: "US, Dvorak, Russian..."
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Target app (where text should appear)
      placeholder: "Safari, Slack, Terminal, VS Code..."
    validations:
      required: true
  - type: input
    id: mic
    attributes:
      label: Microphone device
      placeholder: "MacBook Pro microphone, AirPods..."
  - type: dropdown
    id: provider
    attributes:
      label: Engine / provider
      description: Settings → Languages shows where each language runs.
      options:
        - On this Mac (free, English only)
        - OpenRouter
        - Google AI Studio (direct)
        - OpenAI-compatible endpoint
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Log excerpt (optional)
      description: "Settings → Developer → Open logs, or `~/Library/Application Support/Soyla/app.log`. It holds timings and error classes only, never dictated text. Check it before pasting."
      render: text
